name: Live verification

# Every bundled operation against the real sites, once a day: `npm run verify:live` from an empty
# home, logged out, at the tool's own pace. The record and its summary are this run's artifact, and
# one issue lists the operations that failed in this run and the one before. Nothing here reports to
# the catalog or carries a secret.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

# one run at a time: the next run's previous record is this one's
concurrency:
  group: verify-live
  cancel-in-progress: false

permissions: {}

# Actions are pinned by commit SHA (a tag can be moved), and no job keeps the token in .git or
# restores a cache, as in ci.yml.
jobs:
  verify:
    # GitHub's runner: the sites see one of its addresses, never a maintainer's machine. It has
    # Google Chrome where src/browser.ts looks for it.
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - run: npm ci
      # exits 0 whenever it wrote the record, whatever the sites answered
      - run: xvfb-run -a npm run -s verify:live -- --out "$RUNNER_TEMP/health"
      - run: cat "$RUNNER_TEMP/health/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: health
          path: |
            ${{ runner.temp }}/health/health.json
            ${{ runner.temp }}/health/summary.md
          if-no-files-found: error
          retention-days: 30

  # The one job that may write: it runs no site traffic, no npm install and none of the checkout's
  # dependencies, only test/verify-live.ts under plain node and the gh CLI.
  issue:
    needs: verify
    # a run on another branch has no say over the tracking issue
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # the previous run's artifact
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            package.json
            test/verify-live.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: health
          path: ${{ runner.temp }}/current
      # The run right before this one, if it left a record. Without one, nothing is decided and the
      # issue stays as it is: a failure counts only when two consecutive runs saw it.
      - name: Download the previous run's record
        env:
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          prev=$(gh run list --workflow verify-live.yml --branch "$BRANCH" --limit 5 --json databaseId,status \
            --jq "map(select(.databaseId != $RUN_ID)) | .[0] | select(.status == \"completed\") | .databaseId")
          if [ -n "$prev" ]; then
            gh run download "$prev" --name health --dir "$RUNNER_TEMP/previous" || echo "run $prev left no record"
          fi
      - name: Update the tracking issue
        run: |
          gh issue list --author app/github-actions --state all --limit 100 --json number,title,state > "$RUNNER_TEMP/issues.json"
          plan=$(node test/verify-live.ts track --current "$RUNNER_TEMP/current/health.json" \
            --previous "$RUNNER_TEMP/previous/health.json" --issues "$RUNNER_TEMP/issues.json" --body "$RUNNER_TEMP/body.md")
          echo "$plan"
          action=$(jq -r .action <<<"$plan")
          number=$(jq -r '.number // empty' <<<"$plan")
          title=$(jq -r .title <<<"$plan")
          case "$action" in
            create) gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md" ;;
            update) gh issue edit "$number" --body-file "$RUNNER_TEMP/body.md" ;;
            reopen) gh issue edit "$number" --body-file "$RUNNER_TEMP/body.md" && gh issue reopen "$number" ;;
            close) gh issue edit "$number" --body-file "$RUNNER_TEMP/body.md" && gh issue close "$number" ;;
            none) ;;
            *) echo "::error::unknown action: $action"; exit 1 ;;
          esac
