name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned by commit SHA (a tag can be moved), and no job keeps the token in .git or restores
# a cache: outside code reaches a self-hosted runner once a maintainer approves a fork's run.
jobs:
  check:
    # Pushes and same-repository pull requests run on a fresh Instabox machine (4 vCPU, 8 GiB) per
    # job, or on CI_RUNS_ON when it is set; pull requests from forks use GitHub's runner. A fork
    # could edit this line to spend Instabox credit, so the repository requires approval before any
    # outside contributor's workflow runs. Both machines have Google Chrome where src/browser.ts
    # looks for it.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNS_ON || 'instabox-medium') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 22 is the oldest supported; its fetch decodes fewer encodings than 24's
        node: [22, 24]
    name: check (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      # the browser tests drive the runner's installed Google Chrome; login opens a visible window.
      # REQUIRE_BROWSER=1 fails the run when no browser is found, where the browser tests would skip.
      - run: xvfb-run -a npm test
        env:
          REQUIRE_BROWSER: "1"
      # install the packed tarball outside the checkout and run its CLI and library
      - run: npm run smoke:pack

  python:
    # The Python client in python/: build it, install the wheel in a fresh venv and run the unit tests
    # against it (a fake server on localhost; no Node, no network). Every minor pyproject allows from
    # 3.9 up is tested: a typing or stdlib change between minors is not visible from one end only.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    name: python (${{ matrix.python }})
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      - name: Test the built wheel
        env:
          PY: ${{ matrix.python }}
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          # the framework adapters' tests skip where their framework is not installed
          if [ "$PY" = "3.13" ]; then "$RUNNER_TEMP/venv/bin/pip" install langchain-core openai-agents; fi
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests -t . -v

  secrets:
    # Runs for every pull request, a fork's included, on GitHub's runner: it needs no browser, and
    # a fork's commits are the ones most worth scanning before review.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks, verified by SHA-256
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      # every commit's diff, with --remerge-diff showing what a merge changed beyond an automatic
      # merge; then the checked-out tree
      - name: Scan the history and the tree
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --log-opts="--remerge-diff" .
          "$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact --no-banner .

  # One check to require in branch protection: a skipped or cancelled job never passes for a green one.
  ci:
    name: CI
    if: always()
    needs: [check, python, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error::Jobs that did not succeed: ${failed//$'\n'/, }"
            exit 1
          fi
