name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # CI_RUNS_ON=instabox runs pushes and same-repository pull requests on the self-hosted Instabox
    # box; pull requests from forks use GitHub's runner. A fork could edit this line, so the
    # repository requires approval before any outside contributor's workflow runs. Both machines
    # have Google Chrome where src/browser.ts looks for it.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNS_ON || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 22 is the oldest supported; its fetch decodes fewer encodings than 24's
        node: [22, 24]
    name: check (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      # the browser tests drive the runner's installed Google Chrome; login opens a visible window
      - run: xvfb-run -a npm test
