<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-label="Benchmark, median of 5 runs. 1 date: browser 12.9 s and $0.166, API Anything 8.4 s and $0.074. 5 dates: browser 41.6 s and $0.154, API Anything 21.1 s and $0.152. 1.5 to 2 times sooner, about half the tokens, 20 of 20 answers correct. Goodreads, 5 books: browser 182.5 s, API Anything 30.5 s." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Benchmark, median of 5 runs. 1 date: browser 12.9 s and $0.166, API Anything 8.4 s and $0.074. 5 dates: browser 41.6 s and $0.154, API Anything 21.1 s and $0.152. 1.5 to 2 times sooner, about half the tokens, 20 of 20 answers correct. Goodreads, 5 books: browser 182.5 s, API Anything 30.5 s.</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0.5" y="0.5" width="1279" height="479" rx="16" fill="#fbfbfa" stroke="#e6e5df"/><text x="40" y="62" font-size="22" font-weight="700" fill="#0b0b0b" letter-spacing="-0.3">Same agent, same prompt: driving a browser vs calling API Anything</text><text x="40" y="90" font-size="15" fill="#85847e">Google Flights, cheapest nonstop SFO to JFK. Median of 5 runs per setup. Claude Opus 5.5 in Claude Code, 2026-09-28.</text><rect x="40" y="114" width="288" height="96" rx="12" fill="#ffffff" stroke="#e6e5df"/><text x="60" y="162" font-size="36" font-weight="700" fill="#1f63b8" letter-spacing="-0.8">1.5–2×</text><text x="60" y="190" font-size="15" fill="#4f4e4a">sooner to answer</text><rect x="344" y="114" width="288" height="96" rx="12" fill="#ffffff" stroke="#e6e5df"/><text x="364" y="162" font-size="36" font-weight="700" fill="#1f63b8" letter-spacing="-0.8">about ½</text><text x="364" y="190" font-size="15" fill="#4f4e4a">the tokens read</text><rect x="648" y="114" width="288" height="96" rx="12" fill="#ffffff" stroke="#e6e5df"/><text x="668" y="162" font-size="36" font-weight="700