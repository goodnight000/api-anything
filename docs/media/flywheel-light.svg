<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="The agent internet loop. 1 Ask: an agent needs a website. 2 Find: search the shared catalog. 3 Learn: from the site's own requests, if nobody shared it. 4 Share: cookies and tokens stripped. 5 Verify: other installs' calls vote. 6 Repair: one fix reaches everyone. Like reCAPTCHA, which digitized books from words people typed anyway, API Anything turns the web into APIs from calls agents make anyway." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>The agent internet loop. 1 Ask: an agent needs a website. 2 Find: search the shared catalog. 3 Learn: from the site's own requests, if nobody shared it. 4 Share: cookies and tokens stripped. 5 Verify: other installs' calls vote. 6 Repair: one fix reaches everyone. Like reCAPTCHA, which digitized books from words people typed anyway, API Anything turns the web into APIs from calls agents make anyway.</title><style>.march{stroke-dasharray:2 7;animation:march 1.4s linear infinite}@keyframes march{to{stroke-dashoffset:-9}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0.5" y="0.5" width="1279" height="559" rx="16" fill="#fbfbfa" stroke="#e6e5df"/><defs><marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1L9,5L1,9z" fill="#85847e"/></marker><marker id="arrowApi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1L9,5L1,9z" fill="#2a78d6"/></marker><radialGradient id="dot"><stop offset="0" stop-color="#2a78d6"/><stop offset=".5" stop-color="#2a78d6" stop-opacity=".5"/><stop offset="1" stop-color="#2a78d6" stop-opacity="0"/></radialGradient><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#dcdbd5"/></pattern></defs><rect x="1" y="1" width="1278" height="558" rx="15" fill="url(#dots)" opacity=".7"/><text x="48" y="150" font-size="13" fill="#85847e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.3">2007</text><text x="48" y="184" font-size="22" font-weight="700" fill="#0b0b0b" letter-spacing="-0.3">reCAPTCHA</text><text x="48" y="220" font-size="16" fill="#4f4e4a">People typed two words to</text><text x="48" y="245" font-size="16" fill="#4f4e4a">prove they were human.</text><text x="48" y="270" font-size="16" fill="#4f4e4a">One word came from a</text><text x="48" y="295" font-size="16" fill="#4f4e4a">scanned book. Millions of</text><text x="48" y="320" font-size="16" fill="#4f4e4a">books got digitized.</text><text x="1012" y="150" font-size="13" fill="#85847e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.3">now</text><text x="1012" y="184" font-size="22" font-weight="700" fill="#1f63b8" letter-spacing="-0.3">API Anything</text><text x="1012" y="220" font-size="16" fill="#4f4e4a">Agents call websites to get</text><text x="1012" y="245" font-size="16" fill="#4f4e4a">their work done. Each call</text><text x="1012" y="270" font-size="16" fill="#4f4e4a">learns, checks or repairs</text><text x="1012" y="295" font-size="16" fill="#4f4e4a">an API that every other</text><text x="1012" y="320" font-size="16" fill="#4f4e4a">agent can use.</text><path d="M774.9,130.6A262,186 0 0 1 810.2,148.6" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" class="march" marker-end="url(#arrowApi)"/><path d="M894.2,245A262,186 0 0 1 894.2,335" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" class="march" marker-end="url(#arrowApi)"/><path d="M810.2,431.4A262,186 0 0 1 774.9,449.4" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" class="march" marker-end="url(#arrowApi)"/><path d="M505.1,449.4A262,186 0 0 1 469.8,431.4" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" class="march" marker-end="url(#arrowApi)"/><path d="M385.8,335A262,186 0 0 1 385.8,245" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" class="march" marker-end="url(#arrowApi)"/><path d="M469.8,148.6A262,186 0 0 1 505.1,130.6" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" class="march" marker-end="url(#arrowApi)"/><circle r="16" fill="url(#dot)"><animateMotion dur="9s" repeatCount="indefinite" path="M640,104A262,186 0 0 1 640,476A262,186 0 0 1 640,104"/></circle><circle cx="640" cy="290" r="86" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/><text x="640" y="268" font-size="22" font-weight="600" fill="#2a78d6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">{ }</text><text x="640" y="298" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">shared catalog</text><text x="640" y="320" font-size="12.5" fill="#4f4e4a" text-anchor="middle">stores specs and</text><text x="640" y="336" font-size="12.5" fill="#4f4e4a" text-anchor="middle">counts reports</text><rect x="516" y="66" width="248" height="76" rx="14" fill="#ffffff" stroke="#4f4e4a" stroke-width="1.75"/><circle cx="544" cy="104" r="13" fill="#4f4e4a"/><text x="544" y="109" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="568" y="100" font-size="19" font-weight="700" fill="#0b0b0b" letter-spacing="-0.2">Ask</text><text x="568" y="123" font-size="13.5" fill="#4f4e4a">an agent needs a website</text><rect x="742.9" y="159" width="248" height="76" rx="14" fill="#ffffff" stroke="#2a78d6" stroke-width="1.75"/><circle cx="770.9" cy="197" r="13" fill="#2a78d6"/><text x="770.9" y="202" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="794.9" y="193" font-size="19" font-weight="700" fill="#0b0b0b" letter-spacing="-0.2">Find</text><text x="794.9" y="216" font-size="13.5" fill="#4f4e4a">search the shared catalog</text><rect x="742.9" y="345" width="248" height="76" rx="14" fill="#ffffff" stroke="#eb6834" stroke-width="1.75"/><circle cx="770.9" cy="383" r="13" fill="#eb6834"/><text x="770.9" y="388" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="794.9" y="379" font-size="19" font-weight="700" fill="#0b0b0b" letter-spacing="-0.2">Learn</text><text x="794.9" y="402" font-size="13.5" fill="#4f4e4a">from the site's own requests</text><rect x="516" y="438" width="248" height="76" rx="14" fill="#ffffff" stroke="#1a7f37" stroke-width="1.75"/><circle cx="544" cy="476" r="13" fill="#1a7f37"/><text x="544" y="481" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="568" y="472" font-size="19" font-weight="700" fill="#0b0b0b" letter-spacing="-0.2">Share</text><text x="568" y="495" font-size="13.5" fill="#4f4e4a">cookies and tokens stripped</text><rect x="289.1" y="345" width="248" height="76" rx="14" fill="#ffffff" stroke="#2a78d6" stroke-width="1.75"/><circle cx="317.1" cy="383" r="13" fill="#2a78d6"/><text x="317.1" y="388" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="341.1" y="379" font-size="19" font-weight="700" fill="#0b0b0b" letter-spacing="-0.2">Verify</text><text x="341.1" y="402" font-size="13.5" fill="#4f4e4a">other installs' calls vote</text><rect x="289.1" y="159" width="248" height="76" rx="14" fill="#ffffff" stroke="#eb6834" stroke-width="1.75"/><circle cx="317.1" cy="197" r="13" fill="#eb6834"/><text x="317.1" y="202" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="341.1" y="193" font-size="19" font-weight="700" fill="#0b0b0b" letter-spacing="-0.2">Repair</text><text x="341.1" y="216" font-size="13.5" fill="#4f4e4a">one fix reaches everyone</text><text x="640" y="538" font-size="13.5" fill="#85847e" text-anchor="middle">Every call runs on the user's own machine, browser and network. Only specs and outcomes reach the catalog.</text></svg>