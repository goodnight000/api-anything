<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-label="How API Anything works. 1, Learn: the browser loads the page for two example inputs; what changed becomes a slot, and cookies become references. 2, Call: tier 1 sends plain HTTP with Node fetch, with no browser; if the site blocks that, tier 2 fetches from inside a browser page; as a last resort for reads, tier 3 runs the page and reads its response. Every result carries class, write, retry and nextCall. 3, Repair: when a request drifts, re-learn it, replay it, and save it only if the replay succeeds." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>How API Anything works. 1, Learn: the browser loads the page for two example inputs; what changed becomes a slot, and cookies become references. 2, Call: tier 1 sends plain HTTP with Node fetch, with no browser; if the site blocks that, tier 2 fetches from inside a browser page; as a last resort for reads, tier 3 runs the page and reads its response. Every result carries class, write, retry and nextCall. 3, Repair: when a request drifts, re-learn it, replay it, and save it only if the replay succeeds.</title><style>.drop{stroke-dasharray:3 5;animation:drop 1.4s linear infinite}@keyframes drop{to{stroke-dashoffset:-8}}.land{animation:land 3.6s cubic-bezier(.23,1,.32,1) infinite}@keyframes land{0%,28%{opacity:0}33%{opacity:.18}75%,100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0.5" y="0.5" width="1279" height="899" rx="16" fill="#fbfbfa" stroke="#e6e5df"/><defs><marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1L9,5L1,9z" fill="#85847e"/></marker><marker id="arrowApi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1L9,5L1,9z" fill="#2a78d6"/></marker><radialGradient id="tok"><stop offset="0" stop-color="#2a78d6"/><stop offset=".45" stop-color="#2a78d6" stop-opacity=".55"/><stop offset="1" stop-color="#2a78d6" stop-opacity="0"/></radialGradient></defs><rect x="32" y="32" width="1216" height="220" rx="12" fill="#ffffff" stroke="#e6e5df"/><circle cx="69" cy="71" r="13" fill="#0b0b0b"/><text x="69" y="76" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="92" y="78" font-size="22" font-weight="700" fill="#0b0b0b" letter-spacing="-0.3">Learn</text><text x="160" y="78" font-size="16" fill="#85847e">once, from two example inputs</text><text x="56" y="122" font-size="14" fill="#85847e">two example inputs</text><rect x="56" y="136" width="220" height="36" rx="8" fill="#f1f0ec"/><text x="72" y="160" font-size="16" fill="#4f4e4a" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"><tspan fill="#4f4e4a">domain=</tspan><tspan fill="#b94a1b" font-weight="600">github.com</tspan></text><rect x="56" y="182" width="220" height="36" rx="8" fill="#f1f0ec"/><text x="72" y="206" font-size="16" fill="#4f4e4a" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"><tspan fill="#4f4e4a">domain=</tspan><tspan fill="#b94a1b" font-weight="600">github.io</tspan></text><path d="M296,177H386" fill="none" stroke="#85847e" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowMuted)" /><text x="340" y="166" font-size="13" fill="#85847e" text-anchor="middle">the browser</text><text x="340" y="196" font-size="13" fill="#85847e" text-anchor="middle">loads each</text><text x="408" y="122" font-size="14" fill="#85847e">the request each load sent</text><rect x="408" y="136" width="304" height="36" rx="8" fill="#f1f0ec"/><text x="424" y="160" font-size="16" fill="#4f4e4a" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"><tspan fill="#0b0b0b" font-weight="600">GET </tspan><tspan fill="#4f4e4a">/from?site=</tspan><tspan fill="#b94a1b" font-weight="600">github.com</tspan></text><rect x="408" y="182" width="304" height="36" rx="8" fill="#f1f0ec"/><text x="424" y="206" font-size="16" fill="#4f4e4a" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"><tspan fill="#0b0b0b" font-weight="600">GET </tspan><tspan fill="#4f4e4a">/from?site=</tspan><tspan fill="#b94a1b" font-weight="600">github.io</tspan></text><path d="M732,177H832" fill="none" stroke="#85847e" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowMuted)" /><text x="782" y="166" font-size="13" fill="#85847e" text-anchor="middle">what changed</text><text x="782" y="196" font-size="13" fill="#85847e" text-anchor="middle">becomes a slot</text><text x="852" y="122" font-size="14" fill="#85847e">the saved operation</text><rect x="852" y="136" width="372" height="82" rx="10" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/><text x="870" y="168" font-size="16" fill="#4f4e4a" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"><tspan fill="#0b0b0b" font-weight="600">GET </tspan><tspan fill="#4f4e4a">/from?site=</tspan></text><rect x="1015" y="151" width="86.8" height="24" rx="6" fill="#2a78d6"/><text x="1020" y="168" font-size="16" font-weight="600" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">{domain}</text><text x="870" y="202" font-size="16" fill="#4f4e4a" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">Cookie: </text><rect x="947.8" y="185" width="115.6" height="24" rx="6" fill="#ffffff"/><text x="952.8" y="202" font-size="16" font-weight="600" fill="#1f63b8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">cookie:user</text><text x="1224" y="240" font-size="14" fill="#85847e" text-anchor="end">No LLM. Cookies and tokens become references, never values.</text><rect x="32" y="276" width="680" height="388" rx="12" fill="#ffffff" stroke="#e6e5df"/><circle cx="69" cy="315" r="13" fill="#0b0b0b"/><text x="69" y="320" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="92" y="322" font-size="22" font-weight="700" fill="#0b0b0b" letter-spacing="-0.3">Call</text><text x="140" y="322" font-size="16" fill="#85847e">every time, the fastest way first</text><rect x="56" y="342" width="460" height="34" rx="8" fill="#f1f0ec"/><text x="70" y="364" font-size="15" fill="#4f4e4a" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"><tspan fill="#4f4e4a">api-anything call </tspan><tspan fill="#0b0b0b">hn-demo links </tspan><tspan fill="#4f4e4a">domain=</tspan><tspan fill="#1f63b8" font-weight="600">arxiv.org</tspan></text><rect x="56" y="396" width="380" height="56" rx="10" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/><text x="76" y="418" font-size="12" font-weight="700" fill="#1f63b8" letter-spacing="1.2">TIER 1</text><text x="76" y="440" font-size="17" font-weight="600" fill="#0b0b0b">Node fetch, plain HTTP</text><text x="418" y="430" font-size="15" font-weight="600" fill="#1f63b8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="end">no browser</text><path d="M160,456V488" fill="none" stroke="#85847e" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowMuted)" class="drop"/><text x="176" y="477" font-size="14" fill="#4f4e4a">if the site blocks plain HTTP</text><path d="M440,424H754" fill="none" stroke="#2a78d6" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowApi)" /><rect x="136" y="492" width="380" height="56" rx="10" fill="#ffffff" stroke="#d6d5ce" stroke-width="1.5"/><text x="156" y="514" font-size="12" font-weight="700" fill="#85847e" letter-spacing="1.2">TIER 2</text><text x="156" y="536" font-size="17" font-weight="600" fill="#0b0b0b">fetch from inside a browser page</text><path d="M240,552V584" fill="none" stroke="#85847e" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowMuted)" class="drop"/><text x="256" y="573" font-size="14" fill="#4f4e4a">last resort for a read: repair failed</text><path d="M520,520H724V424" fill="none" stroke="#85847e" stroke-width="1.75" stroke-linejoin="round"/><rect x="216" y="588" width="380" height="56" rx="10" fill="#ffffff" stroke="#d6d5ce" stroke-width="1.5"/><text x="236" y="610" font-size="12" font-weight="700" fill="#85847e" letter-spacing="1.2">TIER 3</text><text x="236" y="632" font-size="17" font-weight="600" fill="#0b0b0b">run the page, read its response</text><text x="578" y="622" font-size="13" fill="#85847e" text-anchor="end">reads only</text><path d="M600,616H724V424" fill="none" stroke="#85847e" stroke-width="1.75" stroke-linejoin="round"/><path d="M96,378V392" fill="none" stroke="#85847e" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowMuted)" /><rect x="736" y="276" width="512" height="388" rx="12" fill="#ffffff" stroke="#e6e5df"/><text x="760" y="322" font-size="22" font-weight="700" fill="#0b0b0b" letter-spacing="-0.3">Result</text><text x="836" y="322" font-size="16" fill="#85847e">fields an agent can act on</text><text x="760" y="394" font-size="14" fill="#85847e">a read that worked</text><rect x="760" y="407" width="464" height="34" rx="8" fill="#f1f0ec" stroke="#2a78d6" stroke-width="1.5"/><text x="774" y="429" font-size="14" fill="#85847e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"><tspan fill="#85847e">{&quot;ok&quot;: </tspan><tspan fill="#1a7f37" font-weight="600">true</tspan><tspan fill="#85847e">, &quot;class&quot;: </tspan><tspan fill="#1a7f37">&quot;ok&quot;</tspan><tspan fill="#85847e">, &quot;tier&quot;: </tspan><tspan fill="#1f63b8" font-weight="600">1</tspan><tspan fill="#85847e">, &quot;ms&quot;: </tspan><tspan fill="#1f63b8" font-weight="600">111</tspan><tspan fill="#85847e">}</tspan></text><rect class="land" x="760" y="407" width="464" height="34" rx="8" fill="#2a78d6" opacity="0"/><text x="760" y="478" font-size="15" font-weight="600" fill="#1f63b8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">class</text><text x="817" y="478" font-size="15" fill="#4f4e4a">what happened</text><text x="760" y="499" font-size="12.5" fill="#85847e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">ok · drift · auth · rate · blocked · input · error · …</text><text x="760" y="525" font-size="15" font-weight="600" fill="#1f63b8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">write</text><text x="817" y="525" font-size="15" fill="#4f4e4a">what a write did; a repeat is refused</text><text x="760" y="546" font-size="12.5" fill="#85847e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">not_sent · not_applied · accepted · applied · may_have_applied</text><text x="760" y="572" font-size="15" font-weight="600" fill="#1f63b8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">retry</text><text x="817" y="572" font-size="15" fill="#4f4e4a">whether to send it again</text><text x="760" y="593" font-size="12.5" fill="#85847e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">no · safe · after_wait · after_fix</text><text x="760" y="619" font-size="15" font-weight="600" fill="#1f63b8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">nextCall</text><text x="844" y="619" font-size="15" fill="#4f4e4a">the one step to take next</text><text x="760" y="640" font-size="12.5" fill="#85847e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">login · relearn · fix_args · check_site · …</text><rect x="32" y="688" width="1216" height="180" rx="12" fill="#ffffff" stroke="#e6e5df"/><circle cx="69" cy="727" r="13" fill="#0b0b0b"/><text x="69" y="732" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="92" y="734" font-size="22" font-weight="700" fill="#0b0b0b" letter-spacing="-0.3">Repair</text><text x="168" y="734" font-size="16" fill="#85847e">only when a request drifts</text><rect x="56" y="754" width="262" height="90" rx="10" fill="#ffffff" stroke="#d6d5ce" stroke-width="1.5"/><text x="74" y="784" font-size="17" font-weight="600" fill="#0b0b0b">It drifts</text><text x="74" y="809" font-size="14" fill="#4f4e4a">the answer stops fitting:</text><text x="74" y="829" font-size="14" fill="#4f4e4a">a rotated id, a moved field</text><path d="M326,799H350" fill="none" stroke="#85847e" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowMuted)" /><rect x="358" y="754" width="262" height="90" rx="10" fill="#ffffff" stroke="#d6d5ce" stroke-width="1.5"/><text x="376" y="784" font-size="17" font-weight="600" fill="#0b0b0b">Re-learn</text><text x="376" y="809" font-size="14" fill="#4f4e4a">rescan the page's scripts, or</text><text x="376" y="829" font-size="14" fill="#4f4e4a">capture the request again</text><path d="M628,799H652" fill="none" stroke="#85847e" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowMuted)" /><rect x="660" y="754" width="262" height="90" rx="10" fill="#ffffff" stroke="#d6d5ce" stroke-width="1.5"/><text x="678" y="784" font-size="17" font-weight="600" fill="#0b0b0b">Replay</text><text x="678" y="809" font-size="14" fill="#4f4e4a">send the new request</text><text x="678" y="829" font-size="14" fill="#4f4e4a">with the call's own inputs</text><path d="M930,799H954" fill="none" stroke="#85847e" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowMuted)" /><rect x="962" y="754" width="262" height="90" rx="10" fill="#e3f3e7" stroke="#1a7f37" stroke-width="1.5"/><text x="980" y="784" font-size="17" font-weight="600" fill="#1a7f37">Save</text><text x="980" y="809" font-size="14" fill="#4f4e4a">only if the replay succeeds;</text><text x="980" y="829" font-size="14" fill="#4f4e4a">otherwise, an honest error</text><circle r="9" fill="url(#tok)" opacity="0"><animateMotion dur="3.6s" repeatCount="indefinite" path="M96,378V424H760" keyPoints="0;1;1" keyTimes="0;0.3;1" calcMode="spline" keySplines="0.45 0 0.2 1;0 0 1 1"/><animate attributeName="opacity" dur="3.6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.03;0.28;0.32;1"/></circle></svg>