<svg xmlns="http://www.w3.org/2000/svg" width="952" height="256" viewBox="0 0 952 256" role="img" aria-label="Agent time and cost per task, browser versus API Anything" font-family="Geist, Inter, 'Helvetica Neue', Arial, sans-serif"><rect width="952" height="256" rx="12" fill="#1a1a19"/><rect x="24" y="20" width="12" height="12" rx="3" fill="#d95926"/><text x="42" y="30" fill="#c3c2b7" font-size="13">Agent + browser (Playwright MCP)</text><rect x="294" y="20" width="12" height="12" rx="3" fill="#3987e5"/><text x="312" y="30" fill="#c3c2b7" font-size="13">Agent + API Anything (MCP)</text><text x="24" y="70" fill="#e0e0dc" font-size="15" font-weight="600">Time to answer</text><text x="24" y="113" fill="#c3c2b7" font-size="13">1 date</text><path d="M156,90 H210.13881175025975 a4,4 0 0 1 4,4 V102 a4,4 0 0 1 -4,4 H156 Z" fill="#d95926"><title>Browser: median 12.9 s, range 12.2 s-14.3 s, n=5</title></path><line x1="210.81171247756683" x2="220.20851988287524" y1="98" y2="98" stroke="#c3c2b7" stroke-width="1"/><text x="228.20851988287524" y="103" fill="#e0e0dc" font-size="13" font-variant-numeric="tabular-nums">12.9 s</text><path d="M156,112 H189.8300179465382 a4,4 0 0 1 4,4 V124 a4,4 0 0 1 -4,4 H156 Z" fill="#3987e5"><title>API Anything: median 8.4 s, range 8.1 s-11.3 s, n=5</title></path><line x1="192.3867762350052" x2="206.8866345518088" y1="120" y2="120" stroke="#c3c2b7" stroke-width="1"/><text x="214.8866345518088" y="125" fill="#e0e0dc" font-size="13" font-variant-numeric="tabular-nums">8.4 s</text><text x="24" y="173" fill="#c3c2b7" font-size="13">5 dates</text><path d="M156,150 H339.0684046472088 a4,4 0 0 1 4,4 V162 a4,4 0 0 1 -4,4 H156 Z" fill="#d95926"><title>Browser: median 41.6 s, range 38.7 s-52.9 s, n=5</title></path><line x1="329.7914801171248" x2="394" y1="158" y2="158" stroke="#c3c2b7" stroke-width="1"/><text x="402" y="163" fill="#e0e0dc" font-size="13" font-variant-numeric="tabular-nums">41.6 s</text><path d="M156,172 H246.9482195144989 a4,4 0 0 1 4,4 V184 a4,4 0 0 1 -4,4 H156 Z" fill="#3987e5"><title>API Anything: median 21.1 s, range 20.5 s-24.3 s, n=5</title></path><line x1="248.0617360914329" x2="265.17381694531025" y1="180" y2="180" stroke="#c3c2b7" stroke-width="1"/><text x="273.17381694531025" y="185" fill="#e0e0dc" font-size="13" font-variant-numeric="tabular-nums">21.1 s</text><line x1="156" x2="156" y1="84" y2="192" stroke="#2c2c2a" stroke-width="1"/><text x="488" y="70" fill="#e0e0dc" font-size="15" font-weight="600">Cost per task</text><text x="488" y="113" fill="#c3c2b7" font-size="13">1 date</text><path d="M620,90 H771.5046449751815 a4,4 0 0 1 4,4 V102 a4,4 0 0 1 -4,4 H620 Z" fill="#d95926"><title>Browser: median $0.166, range $0.102-$0.239, n=5</title></path><line x1="715.2284349982511" x2="843.8129936686225" y1="98" y2="98" stroke="#c3c2b7" stroke-width="1"/><text x="851.8129936686225" y="103" fill="#e0e0dc" font-size="13" font-variant-numeric="tabular-nums">$0.166</text><path d="M620,112 H685.1917043627947 a4,4 0 0 1 4,4 V124 a4,4 0 0 1 -4,4 H620 Z" fill="#3987e5"><title>API Anything: median $0.074, range $0.073-$0.077, n=5</title></path><line x1="688.5573420004952" x2="691.6797667097667" y1="120" y2="120" stroke="#c3c2b7" stroke-width="1"/><text x="699.6797667097667" y="125" fill="#e0e0dc" font-size="13" font-variant-numeric="tabular-nums">$0.074</text><text x="488" y="173" fill="#c3c2b7" font-size="13">5 dates</text><path d="M620,150 H759.8287108906767 a4,4 0 0 1 4,4 V162 a4,4 0 0 1 -4,4 H620 Z" fill="#d95926"><title>Browser: median $0.154, range $0.111-$0.254, n=5</title></path><line x1="724.0051216952843" x2="858" y1="158" y2="158" stroke="#c3c2b7" stroke-width="1"/><text x="866" y="163" fill="#e0e0dc" font-size="13" font-variant-numeric="tabular-nums">$0.154</text><path d="M620,172 H757.8373256513144 a4,4 0 0 1 4,4 V184 a4,4 0 0 1 -4,4 H620 Z" fill="#3987e5"><title>API Anything: median $0.152, range $0.151-$0.154, n=5</title></path><line x1="760.9365722527677" x2="763.5797175836226" y1="180" y2="180" stroke="#c3c2b7" stroke-width="1"/><text x="771.5797175836226" y="185" fill="#e0e0dc" font-size="13" font-variant-numeric="tabular-nums">$0.152</text><line x1="620" x2="620" y1="84" y2="192" stroke="#2c2c2a" stroke-width="1"/><text x="24" y="224" fill="#898781" font-size="12">Bar = median of 5 runs, line = range. Task: cheapest nonstop SFO to JFK on Google Flights, for 1 date and for 5 dates.</text><text x="24" y="242" fill="#898781" font-size="12">Claude Opus 5.5 in Claude Code, same prompt. Cost as reported by Claude Code at API rates. Every answer was checked against live fares.</text></svg>
