<svg xmlns="http://www.w3.org/2000/svg" width="952" height="196" viewBox="0 0 952 196" role="img" aria-label="Scripted browser page load versus API Anything call" font-family="Geist, Inter, 'Helvetica Neue', Arial, sans-serif"><rect width="952" height="196" rx="12" fill="#1a1a19"/><rect x="24" y="20" width="12" height="12" rx="3" fill="#d95926"/><text x="42" y="30" fill="#c3c2b7" font-size="13">Headless Chrome, page load</text><rect x="294" y="20" width="12" height="12" rx="3" fill="#3987e5"/><text x="312" y="30" fill="#c3c2b7" font-size="13">api-anything call, tier 1</text><text x="24" y="70" fill="#e0e0dc" font-size="15" font-weight="600">Without an agent: time until a script has the flight list</text><text x="24" y="113" fill="#c3c2b7" font-size="13">1 search</text><path d="M156,90 H615.1702226345083 a4,4 0 0 1 4,4 V102 a4,4 0 0 1 -4,4 H156 Z" fill="#d95926"><title>Browser: median 1.42 s, range 1.01 s-2.16 s, n=10</title></path><line x1="485.51020408163265" x2="858" y1="98" y2="98" stroke="#c3c2b7" stroke-width="1"/><text x="866" y="103" fill="#e0e0dc" font-size="13" font-variant-numeric="tabular-nums">1.42 s</text><path d="M156,112 H532.7926716141001 a4,4 0 0 1 4,4 V124 a4,4 0 0 1 -4,4 H156 Z" fill="#3987e5"><title>API Anything: median 1.17 s, range 1.08 s-1.39 s, n=10</title></path><line x1="508.30241187384047" x2="607.6113172541743" y1="120" y2="120" stroke="#c3c2b7" stroke-width="1"/><text x="615.6113172541743" y="125" fill="#e0e0dc" font-size="13" font-variant-numeric="tabular-nums">1.17 s</text><line x1="156" x2="156" y1="84" y2="132" stroke="#2c2c2a" stroke-width="1"/><text x="24" y="164" fill="#898781" font-size="12">Bar = median of 10 runs, line = range. Chrome is launched each run and waits until prices render (median 37 requests).</text><text x="24" y="182" fill="#898781" font-size="12">The call runs in a new process with fresh state and fetches the same server-rendered results page.</text></svg>
